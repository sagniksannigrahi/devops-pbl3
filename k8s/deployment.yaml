# __IMAGE__ and __VERSION__ are replaced by the Jenkins pipeline at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditrack
  namespace: pbl3
  labels:
    app: meditrack
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: meditrack
  template:
    metadata:
      labels:
        app: meditrack
    spec:
      containers:
        - name: meditrack
          image: __IMAGE__
          # image is built on the same node by Jenkins, so no registry pull is needed
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "__VERSION__"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000   # the "node" user in the node:alpine image
            allowPrivilegeEscalation: false
