# Blue-Green routing is done by these two Services.
# The pipeline switches environments by patching spec.selector.color - it never edits pods.
#
#   meditrack-live    (NodePort 30090) -> the color real users get
#   meditrack-preview (NodePort 30091) -> the idle color, used to test a new release before go-live
#
# Created only once (if missing), so re-running the pipeline never resets the live color.
apiVersion: v1
kind: Service
metadata:
  name: meditrack-live
  namespace: pbl3-bg
  labels:
    app: meditrack-bg
    role: live
spec:
  type: NodePort
  selector:
    app: meditrack-bg
    color: blue
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: meditrack-preview
  namespace: pbl3-bg
  labels:
    app: meditrack-bg
    role: preview
spec:
  type: NodePort
  selector:
    app: meditrack-bg
    color: green
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30091
